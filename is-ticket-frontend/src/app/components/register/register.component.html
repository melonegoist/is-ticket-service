<div class="register-container">
  <div class="glass-card">
    <h2>Register New Account</h2>

    <form (ngSubmit)="onRegister()" class="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
          required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          required>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="isAdmin()"
            (change)="isAdmin.set($any($event.target).checked)">
          Register as Administrator
        </label>
        <small class="hint">Admin registration requires approval from existing administrators</small>
      </div>

      @if (error()) {
        <div class="error-message">{{ error() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <div class="login-link">
      Already have an account?
      <a (click)="navigateToLogin()" class="link">Login here</a>
    </div>
  </div>
</div>
